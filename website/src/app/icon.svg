<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="풍천리를 지켜주세요">
  <!--
    잣송이. 사이트 본문의 PineConeIcon(ForestLetterMotifs.tsx)과 같은 마크지만
    도형은 다시 그렸다. 본문 아이콘은 20:53 비율로 길쭉해서 16px 탭에서는
    4px 남짓한 막대가 되고, 비늘 다섯 겹도 뭉쳐 얼룩이 된다.

    옮겨온 것은 어법이다 — 옆구리를 잘록하게 눌러 층을 만들고 꼭지에 잎을 하나
    얹는다. 내부에 선을 긋지 않고 윤곽만으로 층을 만드는 것이 핵심이다.
    작은 크기에서 먼저 사라지는 건 언제나 안쪽 획이다.

    바탕을 숲 색으로 꽉 채운 것은 탭 줄에서 밝은 테마와 어두운 테마 양쪽에
    똑같이 서기 위해서다. 투명 배경에 초록 도형만 두면 어두운 테마에서 묻힌다.
  -->
  <rect width="64" height="64" rx="14" fill="#2D5016"/>

  <!-- 본문 마크가 솔방울 뒤에 깔아둔 무리(halo). 큰 크기에서 깊이를 주고
       작은 크기에서는 조용히 사라진다. -->
  <ellipse cx="32" cy="36" rx="21" ry="24" fill="#F5F3EC" opacity="0.16"/>

  <!-- 꼭지 잎 -->
  <path d="M32 5c-2.2 3.4-2.2 6.6 0 10 2.2-3.4 2.2-6.6 0-10z" fill="#F5F3EC" opacity="0.8"/>

  <!-- 솔방울. 층마다 밖으로 벌어졌다 안으로 물리는 윤곽이 비늘을 대신한다. -->
  <path
    d="M32 14 19 22l6 3-9 7 7 3-9 7 7 3-6 5c7 5 17 7 17 7s10-2 17-7l-6-5 7-3-9-7 7-3-9-7 6-3z"
    fill="#F5F3EC"/>
</svg>
